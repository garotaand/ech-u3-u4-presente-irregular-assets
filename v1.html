<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Español con Historia</title>
<style>
:root{--wine:#5c1320;--gold:#d4a54a;--cream:#faf6ef;--paper:#fffdf8;--text:#2f2722;--danger:#b63b3b;--success:#2e7d32}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--text);font-family:Georgia,serif;min-height:100vh}
.topbar{padding:1.2rem;background:var(--paper);border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:0}
.topbar h1{color:var(--wine);font-size:2rem}
.topbar p{color:#86684d;margin-top:.2rem}
.progress-shell{width:100%;height:4px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden;margin-top:1rem}
#progress-bar{width:0%;height:100%;background:linear-gradient(90deg,var(--wine),var(--gold));transition:.4s}
#scene-container{max-width:760px;margin:0 auto;padding:1.2rem}
.scene{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.editorial-card{background:var(--paper);border-radius:22px;padding:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.scene-title{color:var(--wine);font-size:2rem;margin-bottom:1rem}
.story-text{line-height:2;font-size:1.05rem}
.inline-input{width:120px;border:none;border-bottom:2px dashed var(--gold);background:transparent;text-align:center;font-size:1rem;color:var(--wine);font-weight:600;outline:none}
.inline-input.correct{border-color:var(--success);color:var(--success)}
.inline-input.wrong{border-color:var(--danger);color:var(--danger)}
.feedback{margin-top:.4rem;font-size:.9rem}
.feedback.success{color:var(--success)}
.feedback.error{color:var(--danger)}
.primary-btn{width:100%;border:none;margin-top:2rem;padding:1rem;border-radius:14px;background:var(--wine);color:white;font-size:1rem;cursor:pointer}
.timer{width:100%;height:6px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden;margin-bottom:1.5rem}
.timer-bar{width:100%;height:100%;background:var(--danger)}
.quiz-option{width:100%;padding:1rem;border-radius:14px;border:1px solid rgba(0,0,0,.08);margin-bottom:.8rem;background:white;cursor:pointer;text-align:left}
.quiz-option.correct{background:#e7f5ea;border-color:var(--success)}
.quiz-option.wrong{background:#ffe8e8;border-color:var(--danger)}
</style>
</head>
<body>
<header class="topbar">
  <h1>Español con Historia</h1>
  <p>Misión: Supervivencia a 10.000 metros</p>
  <div class="progress-shell"><div id="progress-bar"></div></div>
</header>
<main id="scene-container"></main>
<script>
const sceneContainer=document.getElementById('scene-container');
const progressBar=document.getElementById('progress-bar');
const state={currentScene:1};
function normalizeText(text){return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function updateProgress(){const percent=((state.currentScene-1)/3)*100;progressBar.style.width=`${percent}%`;}
function renderScene(){updateProgress();if(state.currentScene===1)renderDiary();if(state.currentScene===2)renderQuiz();if(state.currentScene===3)renderLanding();}
function renderDiary(){
sceneContainer.innerHTML=`
<section class="scene editorial-card">
<h2 class="scene-title">El Diario de Abordo</h2>
<p class="story-text">Laura mira por la ventana y <input id="input-pensar" class="inline-input" placeholder="pensar"/> en Martín todo el tiempo.</p>
<div id="feedback" class="feedback"></div>
<button class="primary-btn" id="continue-btn">Continuar vuelo</button>
</section>`;
const input=document.getElementById('input-pensar');
const feedback=document.getElementById('feedback');
input.addEventListener('input',()=>{
const value=normalizeText(input.value);
if(value==='piensa'){input.classList.remove('wrong');input.classList.add('correct');feedback.className='feedback success';feedback.innerText='Muy bien.';}
else{input.classList.remove('correct');input.classList.add('wrong');feedback.className='feedback error';feedback.innerText='Intenta otra vez.';}
});
document.getElementById('continue-btn').addEventListener('click',()=>{state.currentScene=2;renderScene();});
}
function renderQuiz(){
sceneContainer.innerHTML=`
<section class="scene editorial-card">
<div class="timer"><div class="timer-bar" id="timer-bar"></div></div>
<h2 class="scene-title">Quiz de la Azafata</h2>
<p class="story-text" style="margin-bottom:1.5rem;">Laura ______ pasta.</p>
<button class="quiz-option" data-correct="false">pideis</button>
<button class="quiz-option" data-correct="true">pide</button>
<button class="quiz-option" data-correct="false">piede</button>
</section>`;
let width=100;
const timer=document.getElementById('timer-bar');
const interval=setInterval(()=>{width-=1;timer.style.width=`${width}%`;if(width<=0){clearInterval(interval);state.currentScene=3;renderScene();}},150);
document.querySelectorAll('.quiz-option').forEach(button=>{
button.addEventListener('click',()=>{
clearInterval(interval);
if(button.dataset.correct==='true')button.classList.add('correct');else button.classList.add('wrong');
setTimeout(()=>{state.currentScene=3;renderScene();},1200);
});
});
}
function renderLanding(){
sceneContainer.innerHTML=`
<section class="scene editorial-card">
<h2 class="scene-title">Descenso sobre Madrid</h2>
<p class="story-text">El avión empieza a descender lentamente. Laura aprieta el pasaporte contra el pecho. El verdadero desafío todavía no terminó.</p>
<button class="primary-btn">Cruzar inmigración</button>
</section>`;
}
renderScene();
</script>
</body>
</html>
