<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECH V2.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;700;900&display=swap');
:root{--wine:#5b1018;--gold:#d7a843;--cream:#fbf1df;--paper:#fffaf0;--ink:#2d201b;--green:#2e7d4f;--red:#b3343c;--shadow:0 18px 45px rgba(25,4,6,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at top right,rgba(215,168,67,.18),transparent 35%),linear-gradient(160deg,#2b0709,#5b1018 45%,#220406);font-family:Inter,sans-serif;color:var(--ink)}
.app{max-width:1080px;margin:0 auto}
.header{position:sticky;top:0;z-index:20;background:rgba(35,5,7,.95);border-bottom:2px solid rgba(215,168,67,.45);color:white;padding:10px 14px;display:grid;grid-template-columns:42px 1fr 82px;gap:10px;align-items:center}
.menu{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-size:22px}.brand{text-align:center}.brand h1{font-family:Cormorant Garamond,serif;font-size:22px;color:#fff3cf}.brand p{font-size:11px;color:#e5c887}.score{background:linear-gradient(#ffd978,#d7a843);color:#2b0709;border-radius:999px;padding:9px;font-weight:900;text-align:center;font-size:13px}
.tabs{position:sticky;top:60px;z-index:19;display:flex;gap:8px;overflow:auto;padding:10px 14px;background:rgba(251,241,223,.97);border-bottom:1px solid rgba(215,168,67,.35)}
.tab{flex:0 0 auto;border:1.5px solid rgba(123,23,34,.25);background:#fff9ec;color:#733022;border-radius:999px;padding:10px 15px;font-weight:900}.tab.active{background:var(--wine);color:white}
.stage{padding:18px 14px 60px}
.hero{background:linear-gradient(90deg,rgba(65,8,12,.93),rgba(91,16,24,.75)),url('https://raw.githubusercontent.com/garotaand/ech-u3-u4-presente-irregular-assets/main/transition-1-imagen.png');background-size:cover;background-position:center;border:1px solid rgba(215,168,67,.55);border-radius:28px;padding:26px 20px;color:white;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{font-weight:900;letter-spacing:3px;color:#f4c958;font-size:12px;text-transform:uppercase}.title{font-family:Cormorant Garamond,serif;font-size:40px;line-height:.92;margin:10px 0;color:#fff7e6}.subtitle{font-size:15px;line-height:1.5;color:#ffe8bc}
.card,.mission,.verb-card{background:linear-gradient(180deg,#fffaf1,#fff4df);border:1.5px solid rgba(215,168,67,.45);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2,.card h3,.mission h3,.verb-card h3{font-family:Cormorant Garamond,serif;color:var(--wine);font-size:30px;line-height:1;margin-bottom:10px}
.story{font-size:16px;line-height:2.12}.blank{display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;margin:0 3px}.inf{font-size:12px;color:#8a512b;background:#fff1c7;border:1px solid rgba(215,168,67,.5);border-radius:999px;padding:2px 7px;font-weight:900}.answer{width:112px;border:0;border-bottom:3px solid #bd9447;background:rgba(255,255,255,.42);color:var(--wine);text-align:center;font-weight:900;font-size:16px;padding:4px 6px;outline:none;border-radius:10px 10px 0 0}
.answer.correct{border-color:var(--green);background:#e9f8ef;color:var(--green)}.answer.wrong{border-color:var(--red);background:#ffe6e8;color:var(--red);animation:shake .22s linear}@keyframes shake{30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.micro{min-height:24px;margin-top:10px;font-size:14px;font-weight:800;color:#7a5a4a}.micro.good{color:var(--green)}.micro.bad{color:var(--red)}
.btn{border:0;border-radius:18px;padding:14px 18px;background:linear-gradient(#ffd978,#d7a843);color:#2b0709;font-weight:1000;font-size:16px;box-shadow:0 6px 0 #9a6a20;margin-top:14px;cursor:pointer}.btn.dark{background:linear-gradient(#7b1722,#4b0b13);color:white;box-shadow:0 6px 0 #250407}
.grid,.verb-grid{display:grid;grid-template-columns:1fr;gap:14px}.status,.rule{display:inline-block;margin-top:10px;background:#2d0508;color:#ffd978;border-radius:999px;padding:6px 12px;font-weight:900;font-size:12px}.rule{margin:0;font-family:Inter,sans-serif}.verb-card h3{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{height:9px;background:#ead7b5;border-radius:999px;overflow:hidden;margin-bottom:16px}.timer div{height:100%;width:100%;background:linear-gradient(90deg,#b3343c,#ffcf62)}
.option{display:block;width:100%;border:1.5px solid rgba(91,16,24,.12);background:#fffaf0;border-radius:18px;padding:16px;margin-bottom:10px;font-weight:900;text-align:left;font-size:17px;cursor:pointer}.option.correct{background:#e8f8ee;border-color:var(--green);color:var(--green)}.option.wrong{background:#ffe5e8;border-color:var(--red);color:var(--red)}
.sort-board{display:grid;grid-template-columns:1fr;gap:14px}.img-pool,.drop-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.order-card,.drop-slot{aspect-ratio:1/1;border-radius:18px;border:1.5px solid rgba(215,168,67,.55);background:#fff9ec;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:900;color:var(--wine)}
.order-card{cursor:pointer;box-shadow:0 8px 20px rgba(35,5,7,.12);position:relative}.order-card.selected{outline:4px solid rgba(215,168,67,.55);transform:scale(.98)}.order-card img{width:100%;height:100%;object-fit:cover;border-radius:14px}.order-card span{position:absolute;left:8px;top:8px;background:rgba(35,5,7,.82);color:#ffd978;border-radius:999px;padding:4px 8px;font-size:12px}.drop-slot{border-style:dashed;min-height:130px}.drop-slot.filled{border-style:solid;background:#fff2c9}.drop-slot.correct{border-color:var(--green);background:#e8f8ee}.drop-slot.wrong{border-color:var(--red);background:#ffe5e8}
.cinema{position:fixed;inset:0;background:#090304;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;color:white}.cinema.show{display:flex}.cinema video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}.cinema:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.82))}.cinema-content{position:relative;z-index:2;padding:24px}.cinema-content p{font-family:Cormorant Garamond,serif;font-size:30px;line-height:1.2;text-shadow:0 3px 14px black}
@media(min-width:760px){.grid,.verb-grid{grid-template-columns:repeat(2,1fr)}.sort-board{grid-template-columns:1fr 1fr}.title{font-size:56px}.card{padding:24px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="menu">☰</button><div class="brand"><h1>Módulo 3 y 4</h1><p>Supervivencia a 10.000 metros</p></div><div class="score" id="score">0 pts</div></header>
<nav class="tabs"><button class="tab active" data-scene="mapa">Mapa</button><button class="tab" data-scene="diario">Diario</button><button class="tab" data-scene="ordenar">Imágenes</button><button class="tab" data-scene="repetidor">Repetidor</button><button class="tab" data-scene="azafata">Azafata</button><button class="tab" data-scene="simulador">Simulador</button></nav>
<main class="stage" id="stage"></main></div>
<div class="cinema" id="cinema"><video id="cinemaVideo" playsinline muted></video><div class="cinema-content"><p id="cinemaText"></p><button class="btn" id="cinemaBtn">Continuar</button></div></div>
<script>
const AS="https://raw.githubusercontent.com/garotaand/ech-u3-u4-presente-irregular-assets/main/";
const stage=document.getElementById("stage"),scoreEl=document.getElementById("score"),cinema=document.getElementById("cinema"),cinemaVideo=document.getElementById("cinemaVideo"),cinemaText=document.getElementById("cinemaText"),cinemaBtn=document.getElementById("cinemaBtn");
const state={score:Number(localStorage.getItem("ech_v21_score")||0),answered:JSON.parse(localStorage.getItem("ech_v21_answered")||"{}"),quizIndex:0,quizTimer:null,selectedImage:null};
const diaryItems=[["despedir","despide","Laura muy triste se","de sus padres y de su perro Caramelo en el portal de su casa en São Paulo."],["empezar","empieza","Cuando el taxi llega, el corazón de Laura","a latir muy fuerte porque es su primer viaje internacional."],["pensar","piensa","Durante el trayecto hasta el aeropuerto, Laura","en toda su vida y las dudas la invaden."],["entender","entiende","Ella no","casi nada de español todavía y eso le da pánico."],["facturar","factura","Al llegar al aeropuerto, Laura busca el mostrador de Iberia y","su equipaje."],["dirigir","dirige","Ya con el billete en la mano, ella se","a la puerta de embarque."],["poner","pone","Dentro del avión, Laura","el equipaje de mano en el compartimento."],["sentarse","se sienta","Luego","mira por la ventana."],["pensar","piensa","Laura","en Martín todo el tiempo."],["entender","entiende","Laura se pone nerviosa porque no","bien la pregunta."],["traer","trae","Entonces la azafata le","una botella de agua."],["querer","quiere","Laura","pedir un vaso, pero no conoce esa palabra en español."],["entender","entiende","La azafata no la","."],["sentir","siente","Laura","muchísima vergüenza."],["recordar","recuerda","En ese momento ella","que cuepito era su intento de decir vaso."],["pensar","piensa","Laura","que pollo significa repollo."],["querer","quiere","Como no","tener gases durante el vuelo."],["pedir","pide","Ella","pasta."],["traer","trae","Minutos después, la azafata le","un enorme plato de macarrones con albóndigas."],["volver","vuelve","Después, otra vez, Laura","a sentir miedo."],["entender","entiende","¿Y si nadie me","en España?"],["cerrar","cierra","Entonces ella","los ojos."],["soñar","sueña","Y","con el momento en que va a abrazar a Martín en Madrid."]];
const repetirCards=[
{title:"E → IE",rule:"pensar / empezar / entender",items:[["empezar","empieza","El corazón de Laura","a latir muy fuerte."],["entender","entiendo","Yo no","por qué el pollo vuela."],["pensar","piensa","Laura","en Martín."]]},
{title:"O → UE",rule:"volver / poder / dormir",items:[["volver","vuelve","El miedo","durante la turbulencia."],["poder","puede","Laura no","dormir."],["dormir","duerme","El pasajero de al lado","como si nada."]]},
{title:"E → I",rule:"pedir / seguir / sentir",items:[["pedir","pido","Si tengo sed, yo","agua."],["seguir","sigue","Laura","nerviosa en su asiento."],["sentir","siente","Ella","vergüenza por el cuepito."]]},
{title:"Verbos en -GO",rule:"traer / poner / salir",items:[["traer","trae","La azafata le","agua."],["poner","pone","Laura","la mochila arriba."],["salir","salgo","Yo","de mi zona de confort."]]}];
const sim={panico:[["pensar","pienso","Yo siempre","en el peor escenario."],["empezar","empieza","El vuelo a Madrid","ahora mismo."],["entender","entiende","Laura no","por qué los aviones se mueven."],["querer","queremos","Nosotros","llegar a España sanos y salvos."],["cerrar","cierran","Los pasajeros asustados","las ventanas."]],menu:[["pedir","pides","Si tú","pollo, te traen un ave."],["seguir","sigue","Laura","con hambre."],["servir","sirven","Las azafatas","la cena."],["pedir","pido","Yo siempre","agua mineral."],["sonreír","sonríe","Laura","para disimular la vergüenza."]]};
const quiz=[{q:"Laura tiene hambre y la azafata le pregunta qué comer. Laura...",a:["pides pasta","pide pasta","piede pasta","pede pasta"],ok:1},{q:"Si yo no ______ las preguntas, estoy perdida.",a:["entiendo","entendo","eintiendo","entiendes"],ok:0},{q:"La azafata le ______ un vaso de agua a Laura.",a:["traiga","traes","traze","trae"],ok:3},{q:"Cuando el avión se mueve, Laura ______ los ojos.",a:["cerra","cierra","cierras"],ok:1},{q:"Disculpe, ¿usted ______ dormir?",a:["puedes","puede","podes"],ok:1}];
const imageOrder=[{id:"despedida",label:"Despedida",img:"ejercicicio-asociar-imagen-laura-despide-padres.png"},{id:"cuepito",label:"Cuepito",img:"ejercicicio-asociar-imagen-laura-dice-cuepito.png"},{id:"repollo",label:"Pollo / repollo",img:"ejercicicio-asociar-imagen-laura-entiende-repollo.png"},{id:"duerme",label:"Cierra los ojos",img:"ejercicicio-asociar-imagen-laura-duerme.png"}],correctOrder=["despedida","cuepito","repollo","duerme"];
function norm(x){return (x||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").trim()}
function save(){localStorage.setItem("ech_v21_score",state.score);localStorage.setItem("ech_v21_answered",JSON.stringify(state.answered))}
function addScore(id,pts=6){if(state.answered[id])return;state.answered[id]=true;state.score+=pts;scoreEl.textContent=state.score+" pts";save()}
function setMicro(text,type=""){const micro=document.querySelector(".micro");if(micro){micro.textContent=text;micro.className="micro "+type}}
function validateInput(input){const ok=norm(input.value)===norm(input.dataset.answer),id=input.dataset.id;if(!input.value.trim()){input.classList.remove("correct","wrong");return false}if(ok){input.classList.remove("wrong");input.classList.add("correct");addScore(id);setMicro("Bien. Laura respira un poco mejor.","good")}else{input.classList.remove("correct");input.classList.add("wrong");setMicro("Todavía no. Intenta otra vez.","bad")}return ok}
function bindInputs(){document.querySelectorAll(".answer").forEach(i=>{i.addEventListener("input",()=>validateInput(i));i.addEventListener("blur",()=>validateInput(i))})}
function line(item,prefix){const [inf,ans,before,after]=item,id=prefix+"_"+inf+"_"+ans+"_"+before.slice(0,4);return `<span>${before}</span> <span class="blank"><span class="inf">[${inf}]</span><input class="answer" data-id="${id}" data-answer="${ans}" placeholder="____"></span> <span>${after}</span>`}
function sceneMapa(){stage.innerHTML=`<section class="hero"><div class="eyebrow">Mapa de misiones</div><h1 class="title">Supervivencia<br>a 10.000 metros</h1><p class="subtitle">Laura está atrapada en la fila 24B. Para aterrizar en Madrid, necesita conjugar correctamente bajo presión.</p></section><section class="grid"><div class="mission"><h3>1. Diario de abordo</h3><p>Texto cloze narrativo con feedback inmediato.</p><span class="status">Listo</span></div><div class="mission"><h3>2. Ordenar imágenes</h3><p>Reconstrucción visual de la historia.</p><span class="status">Nuevo</span></div><div class="mission"><h3>3. Repetidor mecánico</h3><p>Automatización por bloques.</p><span class="status">Revisado</span></div><div class="mission"><h3>4. Quiz de la azafata</h3><p>15 segundos por pregunta.</p><span class="status">Presión</span></div></section>`}
function sceneDiario(){stage.innerHTML=`<section class="hero"><div class="eyebrow">Modo íntimo / editorial</div><h1 class="title">El Diario de Abordo</h1><p class="subtitle">Completa los huecos conjugando los verbos entre paréntesis en Presente de Indicativo.</p></section><section class="card"><h2>Fila 24B</h2><p class="story"><strong>Tu estado actual:</strong> Estás atrapada en la fila 24B. No entiendes bien el idioma, el menú parece una trampa y tu estómago lo sabe. Para que el avión no se caiga —o no mueras de vergüenza— necesitas conjugar correctamente los verbos de tu mente y de tu boca.</p></section><section class="card"><h2>Ejercicio 1</h2><p class="story">${diaryItems.map((it,i)=>line(it,"diario"+i)).join(" ")}</p><div class="micro">Escribe y corrige en el momento.</div><button class="btn dark" onclick="go('ordenar')">Continuar</button></section>`;bindInputs()}
function sceneOrdenar(){stage.innerHTML=`<section class="hero"><div class="eyebrow">Actividad 2</div><h1 class="title">Ordena las imágenes</h1><p class="subtitle">Coloca las imágenes en el orden en que aparecen los momentos de la historia.</p></section><section class="card"><div class="sort-board"><div><h3>Imágenes</h3><div class="img-pool">${imageOrder.map(it=>`<div class="order-card" data-id="${it.id}"><span>${it.label}</span><img src="${AS}${it.img}" onerror="this.remove()"></div>`).join("")}</div></div><div><h3>Orden de la historia</h3><div class="drop-row">${[1,2,3,4].map(i=>`<div class="drop-slot" data-index="${i-1}">${i}</div>`).join("")}</div></div></div><div class="micro">Toca una imagen y luego toca un espacio.</div><button class="btn dark" onclick="checkImageOrder()">Comprobar orden</button><button class="btn" onclick="transitionTo('repetidor','El avión sigue cruzando el Atlántico en la oscuridad...','transition-1-video.mp4')">Avanzar</button></section>`;bindOrder()}
function bindOrder(){state.selectedImage=null;document.querySelectorAll(".order-card").forEach(c=>{c.onclick=()=>{document.querySelectorAll(".order-card").forEach(x=>x.classList.remove("selected"));c.classList.add("selected");state.selectedImage=c.dataset.id}});document.querySelectorAll(".drop-slot").forEach(s=>{s.onclick=()=>{if(!state.selectedImage)return;const label=document.querySelector(`.order-card[data-id="${state.selectedImage}"] span`).textContent;s.textContent=label;s.dataset.value=state.selectedImage;s.classList.add("filled");document.querySelectorAll(".order-card").forEach(x=>x.classList.remove("selected"));state.selectedImage=null}})}
function checkImageOrder(){let allOk=true;document.querySelectorAll(".drop-slot").forEach(s=>{const ok=s.dataset.value===correctOrder[Number(s.dataset.index)];s.classList.remove("correct","wrong");s.classList.add(ok?"correct":"wrong");if(!ok)allOk=false});if(allOk){addScore("ordenar",20);setMicro("Muy bien. Reconstruiste la memoria de Laura.","good")}else setMicro("Hay escenas fuera de orden. Intenta otra vez.","bad")}
function sceneRepetidor(){stage.innerHTML=`<section class="hero"><div class="eyebrow">Automatización</div><h1 class="title">Repetidor Mecánico</h1><p class="subtitle">El pánico repite estructuras. Ahora las entrenamos por bloques.</p></section><section class="verb-grid">${repetirCards.map((card,ci)=>`<div class="verb-card"><h3>${card.title}<span class="rule">${card.rule}</span></h3><p class="story">${card.items.map((it,i)=>line(it,"rep"+ci+"_"+i)).join(" ")}</p></div>`).join("")}</section><section class="card"><div class="micro">Cada bloque é uma mini estación mental.</div><button class="btn dark" onclick="transitionTo('azafata','La azafata regresa con el carrito. Pasillos estrechos. Reflejos rápidos.','transition-2-video.mp4')">Entrar al quiz</button></section>`;bindInputs()}
function sceneAzafata(){state.quizIndex=0;renderQuizQuestion()}
function renderQuizQuestion(){const item=quiz[state.quizIndex];stage.innerHTML=`<section class="card"><div class="timer"><div id="timerBar"></div></div><h2>Quiz de la Azafata</h2><p class="story" style="margin-bottom:16px">${item.q}</p>${item.a.map((x,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(97+i)}) ${x}</button>`).join("")}<div class="micro">Pregunta ${state.quizIndex+1} de ${quiz.length}</div></section>`;let w=100,bar=document.getElementById("timerBar");clearInterval(state.quizTimer);state.quizTimer=setInterval(()=>{w-=1.05;bar.style.width=w+"%";if(w<=0){clearInterval(state.quizTimer);nextQuiz()}},150);document.querySelectorAll(".option").forEach(btn=>{btn.onclick=()=>{clearInterval(state.quizTimer);let ok=Number(btn.dataset.i)===item.ok;btn.classList.add(ok?"correct":"wrong");if(ok)addScore("quiz_"+state.quizIndex,10);setTimeout(nextQuiz,900)}})}
function nextQuiz(){state.quizIndex++;if(state.quizIndex>=quiz.length){transitionTo("simulador","Has sobrevivido al servicio a bordo. Inicia el simulador de vuelo.","transition-3-video.mp4")}else renderQuizQuestion()}
function sceneSimulador(){stage.innerHTML=`<section class="hero"><div class="eyebrow">Sistema avanzado</div><h1 class="title">Simulador de vuelo<br>de Laura</h1><p class="subtitle">Completa los bloques finales de la misión.</p></section><section class="grid"><div class="card"><h3>Control de pánico</h3><p class="story">${sim.panico.map((it,i)=>line(it,"pan"+i)).join(" ")}</p></div><div class="card"><h3>Supervivencia al menú</h3><p class="story">${sim.menu.map((it,i)=>line(it,"men"+i)).join(" ")}</p></div></section><section class="card"><h2>Descenso sobre Madrid</h2><p class="story">El avión empieza a descender lentamente. Laura mira las luces de Madrid por la ventana. El verdadero desafío todavía no terminó.</p></section>`;bindInputs()}
function transitionTo(scene,text,video){cinemaText.textContent=text;cinemaVideo.src=AS+video;cinema.classList.add("show");cinemaVideo.play().catch(()=>{});cinemaBtn.onclick=()=>{cinemaVideo.pause();cinema.classList.remove("show");go(scene)}}
function go(scene){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.scene===scene));if(scene==="mapa")sceneMapa();if(scene==="diario")sceneDiario();if(scene==="ordenar")sceneOrdenar();if(scene==="repetidor")sceneRepetidor();if(scene==="azafata")sceneAzafata();if(scene==="simulador")sceneSimulador();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.scene));scoreEl.textContent=state.score+" pts";go("mapa");
</script>
</body>
</html>
